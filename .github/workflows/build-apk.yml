name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        # This extracts your uploaded zip into a new folder called 'app_source'
        run: unzip "Aura music main updated.zip" -d app_source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK
        # We navigate into the unzipped folder to run the build command
        run: |
          cd app_source
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Debug-APK
          path: app_source/app/build/outputs/apk/debug/app-debug.apk
