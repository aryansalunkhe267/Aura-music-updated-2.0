name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: unzip "Aura music main updated.zip" -d app_source
          
      - name: Generate Keystore, Wrapper & Build
        run: |
          cd app_source
          
          # 1. Generate a generic debug keystore using Java's keytool
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 2. Force the system to generate a brand new gradlew file 
          gradle wrapper
          
          # 3. Make the new wrapper executable
          chmod +x ./gradlew
          
          # 4. Build the APK 
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Debug-APK
          path: app_source/app/build/outputs/apk/debug/*.apk
