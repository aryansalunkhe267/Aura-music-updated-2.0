name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: unzip "Aura music main updated.zip" -d app_source
          
      - name: Generate Missing Gradle Wrapper & Build
        run: |
          cd app_source/"Aura music main updated"
          
          # Force the system to generate a brand new gradlew file 
          gradle wrapper
          
          # Make the new wrapper executable
          chmod +x ./gradlew
          
          # Build the APK using the new wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Debug-APK
          path: app_source/"Aura music main updated"/app/build/outputs/apk/debug/*.apk
